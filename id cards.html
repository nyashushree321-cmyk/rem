<body>

<div class="toolbar">
  <b>REM ID Cards</b>
  <button onclick="printAll()">⬇ Save ALL as one PDF</button>
  <span id="singleBtns"></span>
  <div class="hint">In the print dialog choose <b>Save as PDF</b> → Margins: <b>None</b> → turn <b>Background graphics ON</b> → Scale: 100%.</div>
</div>

<div id="sheets"></div>

<script>
/* ---- same data as leadership.html ---- */
const personnelDB = {
  ganesh: { name:"Mr. K. P. Ganesh", role:"SR. METALLURGIST", dept:"South India Operations",   id:"REM-006", photos:["images/ganesh.jpeg","images/ganesh.jpg"],       blood:"O+VE", profileUrl:"ganesh.html" },
  kishor: { name:"Mr. B. G. Kishor", role:"SR. METALLURGIST", dept:"North India Operations",   id:"REM-004", photos:["images/kishore.jpeg","images/kishor.jpg"],      blood:"B+VE", profileUrl:"kishor.html" },
  kumar:  { name:"Mr. V. S. Kumar",  role:"SR. METALLURGIST", dept:"East India Operations",    id:"REM-005", photos:["images/VSKumar.jpg","images/kumar.jpg"],        blood:"B-VE", profileUrl:"kumar.html" },
  ghouse: { name:"Mr. MD. Ghouse",   role:"COORDINATOR",      dept:"Central India Operations", id:"REM-001", photos:["images/Ghouse.jpeg","images/ghouse.jpg"],       blood:"O-VE", profileUrl:"ghouse.html", noCode:true },
  patro:  { name:"Mr. Mukesh Patro", role:"SR. METALLURGIST", dept:"West India Operations",    id:"REM-007", photos:["images/patro.jpg","images/image.png"],          blood:"A+VE", profileUrl:"patro.html" }
};

const LOGO = "images/image.png";

function qrUrl(p) {
  let base = location.origin;
  if (!base || base === 'null' || base.includes('127.0.0.1') || base.includes('localhost')) base = 'https://rarestearthmetals.in';
  /* SVG QR = perfectly sharp in PDF */
  return 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&format=svg&data=' + encodeURIComponent(base + '/' + p.profileUrl);
}

function cardHTML(k, p) {
  const code = p.noCode ? '' : `
    <div class="code-row">
      <div class="qr-box"><img src="${qrUrl(p)}" alt="QR"></div>
      <div class="barcode-text">*${p.id}*</div>
    </div>`;
  return `
  <div class="pair">
    <div class="id-card">
      <div class="front-header"><img class="card-logo" src="${LOGO}" alt="REM"></div>
      <div class="stripe-gold"></div>
      <div class="front-body">
        <div class="photo-frame"><img data-k="${k}" data-i="0" src="${p.photos[0]}" alt="${p.name}"></div>
        <div class="emp-name">${p.name}</div>
        <div class="emp-role">${p.role}</div>
        <div class="emp-dept">${p.dept}</div>
        <div class="emp-id-num">ID No: ${p.id}</div>
        ${code}
      </div>
      <div class="card-footer-strip">info@rarestearthmetals.in</div>
    </div>

    <div class="id-card">
      <div class="back-header"><img class="card-logo" src="${LOGO}" alt="REM"></div>
      <div class="stripe-gold"></div>
      <div class="back-body">
        <div class="meta-row"><span class="meta-label">Blood group:</span><span class="meta-value">${p.blood}</span></div>
        <div class="meta-row"><span class="meta-label">Valid until:</span><span class="meta-value">31-DEC-2029</span></div>
        <div class="sig-zone">
          <div class="blue-seal">
            <span class="seal-top">RAREST EARTH<br>METALS</span>
            <span class="seal-mid">★ ★ ★</span>
            <span class="seal-badge">AUTHORIZED</span>
            <span class="seal-bottom">SEC-PATIALA</span>
          </div>
          <svg class="sig-svg" viewBox="0 0 155 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 32 C18 20, 28 10, 38 16 C46 20, 30 36, 42 34 C56 32, 60 16, 70 15 C80 14, 84 28, 96 25 C108 22, 116 12, 126 14 C134 15, 138 30, 148 20" stroke="#1e3a8a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          <div class="sig-line"></div>
          <div class="sig-caption">Authorised Signature</div>
        </div>
        <div class="return-box">
          <h4>If found, please return to:</h4>
          <p>Rarest Earth Metals, Industrial Estate,<br>9C98+GF8, Lakhewal, Patiala, Punjab 147004</p>
        </div>
      </div>
      <div class="card-footer-strip">This card is company property.</div>
    </div>
  </div>`;
}

const sheets = document.getElementById('sheets');
const btns   = document.getElementById('singleBtns');

Object.entries(personnelDB).forEach(([k, p]) => {
  sheets.insertAdjacentHTML('beforeend', `
    <section class="sheet" id="sheet-${k}">
      <div class="sheet-title"><small>Official Personnel ID Card</small><h2>${p.name} — ${p.id}</h2></div>
      ${cardHTML(k, p)}
    </section>`);
  btns.insertAdjacentHTML('beforeend', `<button class="alt" onclick="printOne('${k}')">${p.name.replace('Mr. ','')}</button> `);
});

/* photo fallback chain */
document.querySelectorAll('.photo-frame img').forEach(img => {
  img.addEventListener('error', function () {
    const p = personnelDB[this.dataset.k];
    const next = +this.dataset.i + 1;
    if (next < p.photos.length) { this.dataset.i = next; this.src = p.photos[next]; }
  });
});

/* printing helpers */
function allSheets() { return document.querySelectorAll('.sheet'); }
function printAll() { allSheets().forEach(s => s.classList.remove('hide-print')); window.print(); }
function printOne(k) {
  allSheets().forEach(s => s.classList.toggle('hide-print', s.id !== 'sheet-' + k));
  window.print();
}
window.addEventListener('afterprint', () => allSheets().forEach(s => s.classList.remove('hide-print')));
</script>
</body>
